/* PULSE 5.2.2 — separação estrutural dos elementos da entrada.
   A divisão em linhas não depende de CSS: auth-back-row e auth-welcome-row
   são elementos block no HTML. Este CSS controla apenas hierarquia e respiro. */
.auth-panel .auth-intro {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 29px;
  margin-bottom: 19px;
  width: 100%;
}
.auth-panel .auth-back-row,
.auth-panel .auth-welcome-row {
  display: block;
  width: 100%;
  min-width: 0;
}
.auth-panel .auth-intro .auth-back {
  display: inline-flex;
  align-items: center;
  width: auto;
  max-width: 100%;
  margin: 0;
  gap: 8px;
  line-height: 1.5;
  text-align: left;
}
.auth-panel .auth-intro .auth-welcome {
  display: inline-flex;
  align-items: center;
  width: auto;
  max-width: 100%;
  margin: 0;
  gap: 10px;
  color: #ae861c;
  font-size: 11px;
  font-weight: 800;
  line-height: 1.4;
  letter-spacing: 1.5px;
  white-space: normal;
}
.auth-panel .auth-intro .auth-welcome::before {
  content: '';
  flex: 0 0 24px;
  width: 24px;
  height: 2px;
  background: #d3a322;
  border-radius: 99px;
}
.auth-panel h2 { line-height: 1.18; }
@media (max-width: 760px) {
  .auth-panel .auth-intro { gap: 23px; margin-bottom: 16px; }
  .auth-panel .auth-intro .auth-welcome { letter-spacing: 1.2px; }
}
@media (max-width: 370px) {
  .auth-panel .auth-intro { gap: 20px; }
  .auth-panel .auth-intro .auth-welcome { letter-spacing: 1px; font-size: 10px; }
}

// Geração idempotente no navegador para mostrar a lógica de competências mensais.
// Em produção, isso será uma rotina transacional no servidor e nunca um cron do navegador.
function generateBilling(cycle=monthKey()){
  let created=0;
  for(const t of db.trainers){
    if(t.status==='Cancelado')continue;
    if(db.saasInvoices.some(v=>v.trainerId===t.id&&v.cycle===cycle))continue;
    const plan=planBy(t.planId);if(!plan)continue;
    db.saasInvoices.push({id:rndId(),trainerId:t.id,cycle,amount:plan.price,date:dueIn(cycle,t.dueDay),status:'Pendente',planName:plan.name,paidAt:null,method:null});created++;
  }
  for(const e of db.enrollments){
    if(e.status!=='Ativo')continue;
    const startCycle=monthKey(parseISO(e.start));
    const [cy,cm]=cycle.split('-').map(Number),[sy,sm]=startCycle.split('-').map(Number);
    const distance=(cy-sy)*12+cm-sm,frequency=Number(pkgBy(e.packageId)?.frequency)||1;
    if(distance<0||distance%frequency!==0)continue;
    if(db.payments.some(v=>v.enrollmentId===e.id&&v.cycle===cycle))continue;
    db.payments.push({id:rndId(),studentId:e.studentId,enrollmentId:e.id,cycle,amount:e.price,date:dueIn(cycle,e.dueDay),status:'Pendente',description:pkgBy(e.packageId)?.name||'Mensalidade',method:e.method,paidAt:null});created++;
  }
  if(created){audit('geração',`${created} cobrança(s) de demonstração criada(s) na competência ${cycle}`);save()}
  return created;
}

function svgLine(data,w=650,h=180,color='#ecc839',filled=true){const min=Math.min(...data)*.75,max=Math.max(...data)*1.12,dx=w/(data.length-1),y=v=>h-((v-min)/(max-min))*(h-22)-10;let pts=data.map((v,i)=>[i*dx,y(v)]);let pathd='M'+pts.map(([x,y])=>`${x.toFixed(1)},${y.toFixed(1)}`).join(' L');let fill=`${pathd} L${w},${h} L0,${h} Z`;const gids='grad'+String(w)+String(h)+data.length;return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Gráfico ilustrativo de evolução"><defs><linearGradient id="${gids}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".24"/><stop offset="1" stop-color="${color}" stop-opacity=".008"/></linearGradient></defs>${[.25,.5,.75,1].map(t=>`<path d="M0 ${t*h}H${w}" stroke="#eff0f1" stroke-dasharray="5 6"/>`).join('')}${filled?`<path d="${fill}" fill="url(#${gids})"/>`:''}<path d="${pathd}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${pts.map(([x,y],i)=>i===pts.length-1?`<circle cx="${x}" cy="${y}" r="5" fill="${color}" stroke="#fff" stroke-width="2"/>`:'').join('')}</svg>`}

function marketing(){let features=[['users','Alunos em um só lugar','Cadastre, organize e acompanhe todos os seus alunos com fichas, metas e histórico individual.'],['dumbbell','Treinos personalizados','Monte treinos por exercício, séries, repetições e descanso. Distribua os planos em segundos.'],['chart','Evolução em tempo real','Visualize indicadores, frequência e medidas para acompanhar cada conquista.'],['calendar','Agenda inteligente','Tenha uma visão clara das sessões presenciais, avaliações e compromissos da semana.'],['wallet','Gestão financeira','Monitore mensalidades, lançamentos pagos e pendentes em uma única tela.'],['message','Contato mais próximo','Mantenha conversas e orientações em uma área exclusiva entre personal e aluno.']];let prices=db.saasPlans.filter(p=>p.active).map(p=>({name:p.name,desc:p.description,price:Number(p.price).toFixed(2).replace('.',','),list:[p.limit?'Até '+p.limit+' alunos':'Alunos ilimitados','Treinos e acompanhamento','Agenda e gestão financeira','Área exclusiva do aluno'],popular:p.highlight}));return `<div class="marketing"><header class="site-nav"><div class="nav-container"><a href="#/" class="brand brand-nav">${pulseLogo('nav')}</a><nav class="site-navlinks"><button data-scroll="recursos">Recursos</button><button data-scroll="como-funciona">Como funciona</button><button data-scroll="planos">Planos</button><button data-scroll="perguntas">Dúvidas</button></nav><div class="site-actions"><button class="nav-signin" data-go="/login/aluno">Área do aluno</button><button class="btn btn-primary" data-go="/login/treinador">Acessar plataforma ${ico('arrowRight',15)}</button></div></div></header><main><section class="landing-hero"><div class="hero-wrap"><div class="hero-copy"><span class="hero-kicker"><span class="pulse-dot"></span> Gestão inteligente para personal trainers</span><h1>Seu negócio em forma. <em>Seus alunos em evolução.</em></h1><p>Treinos, alunos, agenda, resultados e financeiro em uma plataforma feita para quem transforma vidas através do movimento.</p><div class="hero-buttons"><button class="btn btn-primary btn-lg" data-go="/login/treinador">Explorar painel demo ${ico('arrowRight',17)}</button><button class="btn btn-line-dark btn-lg" data-scroll="recursos">Conhecer recursos ${ico('chevronRight',16)}</button></div><div class="hero-note"><span class="mini-avatars"><i>M</i><i>R</i><i>J</i></span>Uma experiência completa para personal e aluno</div></div>${previewDashboard()}</div></section><div class="trust-strip"><div class="trust-inner"><div class="trust-intro">Tudo que você precisa, no mesmo lugar:</div><div class="trust-points"><span>${ico('checkCircle',16)} Gestão simplificada</span><span>${ico('checkCircle',16)} Acesso do aluno</span><span>${ico('checkCircle',16)} Treinos sob medida</span><span>${ico('checkCircle',16)} Feito para mobile</span></div></div></div><section class="section" id="recursos"><div class="section-wrap"><div class="section-head"><span class="eyebrow">Uma plataforma. Infinitas possibilidades.</span><h2>Mais tempo treinando.<br>Menos tempo administrando.</h2><p>Organize toda a sua rotina profissional com ferramentas que colocam o relacionamento com seus alunos em primeiro lugar.</p></div><div class="feature-grid">${features.map(([icon,title,description])=>`<article class="feature-card"><span class="feature-icon">${ico(icon,23)}</span><h3>${title}</h3><p>${description}</p></article>`).join('')}</div></div></section><section class="section why-section"><div class="split"><div class="split-copy"><span class="eyebrow">Experiência do aluno</span><h2>O acompanhamento continua fora da academia.</h2><p>Seu aluno recebe um espaço exclusivo e intuitivo para consultar o treino, acompanhar metas e manter contato com você.</p><div class="benefits"><div class="benefit"><span class="benefit-icon">${ico('checkSquare',18)}</span><div><b>Treino sempre à mão</b><p>Acesso rápido aos exercícios, às séries e às repetições direto no celular.</p></div></div><div class="benefit"><span class="benefit-icon">${ico('chart',18)}</span><div><b>Motivação com progresso visível</b><p>Registros de evolução e conclusão de cada exercício.</p></div></div><div class="benefit"><span class="benefit-icon">${ico('lock',18)}</span><div><b>Área individual</b><p>Experiência de login própria do aluno, preparada para autenticação segura em produção.</p></div></div></div><div style="margin-top:28px"><button class="btn btn-dark" data-go="/login/aluno">Conhecer área do aluno ${ico('arrowRight',16)}</button></div></div><div class="phone-stage"><div class="phone"><div class="phone-notch"></div><div class="phone-inner"><div class="phone-top"><small style="color:#f2ce3c;font-size:8px;font-weight:700">MEU TREINO DE HOJE</small><div style="font-size:18px;font-weight:800;margin-top:6px">Treino A · Inferiores</div><small style="color:#aaa;font-size:9px">5 exercícios · 55 minutos</small></div><div class="phone-mini"><div class="phone-cardhead"><b style="font-size:11px">Progresso do treino</b><b style="font-size:11px">72%</b></div><div class="phone-fake-progress"></div></div><div class="phone-mini"><b style="font-size:11px">Seus exercícios</b>${['Agachamento livre','Leg press 45°','Cadeira extensora','Afundo com halteres','Elevação pélvica'].map((e,i)=>`<div class="phone-fake-row"><span>${i<3?ico('check',12):String(i+1)}</span>${e}</div>`).join('')}</div></div></div><div class="phone-badge">+12 treinos <small>concluídos no mês</small></div></div></div></section><section class="section" id="como-funciona"><div class="section-wrap"><div class="section-head"><span class="eyebrow">Simples de começar</span><h2>Do cadastro ao resultado.<br>Em poucos passos.</h2><p>Uma jornada clara e fácil de entender, com fluxos demonstrativos acessíveis no protótipo.</p></div><div class="steps"><div class="step"><div class="step-number">01</div><h3>Configure seu perfil</h3><p>Personalize seu painel e organize as informações essenciais do seu serviço.</p></div><div class="step"><div class="step-number">02</div><h3>Cadastre e monte os treinos</h3><p>Inclua alunos, defina o objetivo de cada um e atribua treinos personalizados.</p></div><div class="step"><div class="step-number">03</div><h3>Acompanhe a evolução</h3><p>Gerencie sessões, controle os pagamentos e consulte o progresso de cada aluno.</p></div></div></div></section><section class="section pricing" id="planos"><div class="section-wrap"><div class="section-head"><span class="eyebrow">Planos ilustrativos</span><h2>O plano certo para cada fase.</h2><p>Exemplos de como os planos de assinatura podem ser apresentados na futura plataforma.</p></div><div class="price-grid">${prices.map(p=>`<div class="price-card ${p.popular?'popular':''}">${p.popular?'<span class="popular-ribbon">MAIS POPULAR</span>':''}<div class="price-title">${p.name}</div><div class="price-sub">${p.desc}</div><div class="price-line"><span>R$</span><strong>${p.price}</strong><span>/ mês</span></div><div class="price-features">${p.list.map(f=>`<div>${ico('checkCircle',16)} ${f}</div>`).join('')}</div><button class="btn ${p.popular?'btn-primary':'btn-line-dark'} w-full" data-go="/login/treinador">Testar demonstração ${ico('arrowRight',15)}</button></div>`).join('')}</div><div class="price-note">Valores fictícios apenas para visualização do design. Nenhuma assinatura ou cobrança está ativa.</div></div></section><section class="section" id="perguntas"><div class="section-wrap"><div class="section-head"><span class="eyebrow">Perguntas frequentes</span><h2>Tudo claro para você começar.</h2></div><div class="faq-grid">${[['O aluno tem acesso próprio?','Sim. O protótipo oferece uma experiência separada para o aluno acessar os exercícios, acompanhar a evolução, consultar a agenda e trocar mensagens simuladas.'],['Posso montar treinos personalizados?','Sim. Na demonstração é possível criar modelos de treino e incluir exercícios, séries e repetições, com salvamento local no navegador.'],['Funciona no celular?','Sim. Todas as telas foram planejadas para adaptar o layout ao celular, incluindo menu de navegação inferior nos painéis.'],['É possível cobrar mensalidades aqui?','O protótipo apenas registra lançamentos demonstrativos. Cobranças reais exigirão integração de pagamento e um backend seguro.'],['Os dados ficam salvos?','Nesta primeira versão, os dados de demonstração ficam salvos somente neste navegador. A versão comercial precisará de banco de dados e autenticação real.']].map(([q,a])=>`<details class="faq-item"><summary>${q}${ico('plus',17)}</summary><p>${a}</p></details>`).join('')}</div></div></section><div class="final-cta"><div><h2>Seu próximo nível começa aqui.</h2><p>Entre na demonstração e experimente o painel do personal ou a área do aluno.</p></div><button class="btn btn-dark btn-lg" data-go="/login/treinador">Conhecer a PULSE ${ico('arrowRight',16)}</button></div></main><footer class="site-footer"><div class="footer-wrap"><div class="brand brand-footer">${pulseLogo('footer')}</div><small>© ${today.getFullYear()} PULSE. Protótipo demonstrativo.</small><nav class="footer-nav"><a href="#/login/treinador">Treinador</a><a href="#/login/aluno">Aluno</a><a href="#/login/admin">Admin PULSE</a></nav></div></footer></div>`}
function auth(role,studentId=null){const isStudent=role==='aluno',isAdmin=role==='admin',target=student(studentId); return `<div class="auth-screen"><aside class="auth-side"><a href="#/" class="brand brand-auth" style="align-self:flex-start">${pulseLogo('auth')}</a><div class="auth-message"><span class="eyebrow">${isStudent?'Seu espaço de evolução':isAdmin?'Gestão geral da plataforma':'Seu negócio no controle'}</span><h1>${isStudent?'A evolução começa <em>aqui.</em>':isAdmin?'Visão completa. <em>Controle total.</em>':'Foque nos alunos. <em>O resto é com a gente.</em>'}</h1><p>${isStudent?'Acompanhe cada treino, celebre suas conquistas e mantenha seu plano sempre à mão.':isAdmin?'Acompanhe assinaturas, profissionais, planos e indicadores do negócio em uma visão única.':'Centralize a gestão dos seus alunos, seus treinos e seus resultados em um lugar que acompanha seu ritmo.'}</p></div><div class="auth-illustration"><div class="auth-illus-head"></div><div class="auth-illus-row"><div class="auth-illus-kpi"><b>${isStudent?'12':'24'}</b><small>${isStudent?'TREINOS':'ALUNOS ATIVOS'}</small></div><div class="auth-illus-kpi"><b>${isStudent?'78%':'93%'}</b><small>DESEMPENHO</small></div></div><div class="auth-illus-line">${[1,2,3,4,5,6].map(()=>'<i></i>').join('')}</div></div><div class="auth-foot">PULSE Personal OS · Seu movimento, mais inteligente.</div></aside><main class="auth-main"><div class="auth-panel"><div class="auth-intro"><div class="auth-back-row"><button type="button" class="auth-back" data-go="/">${ico('arrowLeft',16)} Voltar para o site</button></div><div class="auth-welcome-row"><span class="eyebrow auth-welcome">Bem-vindo à PULSE</span></div></div><h2>Acesse sua conta.</h2><p>Escolha seu perfil e entre no ambiente demonstrativo.</p>${target?`<div class="note-box">Acesso individual de ${esc(target.name)} — use o e-mail cadastrado do aluno.</div>`:""}<div class="segmented"><button class="segment ${!isStudent?'active':''}" data-go="/login/treinador">Sou personal</button><button class="segment ${isStudent?'active':''}" data-go="/login/aluno">Sou aluno</button><button class="segment ${isAdmin?'active':''}" data-go="/login/admin">Admin PULSE</button></div><form id="login-form" data-form="login"><input type="hidden" name="role" value="${esc(role)}"><input type="hidden" name="studentTarget" value="${target?.id||''}"><div class="field"><label for="login-email">Seu e-mail</label><input class="control" id="login-email" type="email" name="email" autocomplete="username" required placeholder="seuemail@exemplo.com" value="${esc(target?.email||'')}"></div><div class="field"><label for="login-pass">Senha</label><input class="control" type="password" id="login-pass" name="password" autocomplete="current-password" required placeholder="Digite sua senha"></div><div class="auth-help"><label style="display:flex;gap:7px;align-items:center"><input type="checkbox" checked> Lembrar neste navegador</label><span>Ambiente demo</span></div><button type="submit" class="btn btn-primary w-full btn-lg">Entrar ${ico('arrowRight',16)}</button></form><div class="auth-demo"><strong>${ico('sparkles',14)} Acesso rápido para demonstração</strong><p>Use <code>${isStudent?(target?.email||'aluno@pulse.demo'):isAdmin?'admin@pulse.demo':'personal@pulse.demo'}</code> e senha <code>123456</code> ou entre em um clique.</p><button class="btn btn-dark" data-action="demo-login" data-role="${role}" data-id="${target?.id||1}">Acessar demonstração ${ico('arrowRight',15)}</button></div><p class="auth-disclaimer">Esta tela simula um login. Para uso real será necessário ativar autenticação segura e banco de dados.</p></div></main></div>`}
const TRAIN_NAV=[['visao-geral','dashboard','Visão geral'],['alunos','users','Meus alunos'],['avaliacoes','clipboard','Avaliações'],['treinos','dumbbell','Treinos'],['agenda','calendar','Agenda'],['evolucao','chart','Evolução'],['pacotes','file','Pacotes'],['financeiro','wallet','Financeiro'],['whatsapp','message','WhatsApp'],['mensagens','send','Mensagens'],['configuracoes','settings','Configurações']];
const STU_NAV=[['inicio','dashboard','Início'],['meus-treinos','dumbbell','Meus treinos'],['evolucao','chart','Minha evolução'],['agenda','calendar','Agenda'],['mensalidades','wallet','Mensalidades'],['mensagens','message','Mensagens'],['perfil','user','Meu perfil']];
const MAIN_NAV_TRAIN=['visao-geral','alunos','avaliacoes','agenda','whatsapp'];
const MAIN_NAV_STU=['inicio','meus-treinos','agenda','mensalidades','perfil'];
function shell(role,tab,content){const trainer=role==='treinador',nav=trainer?TRAIN_NAV:STU_NAV,userName=trainer?db.trainer.name:currStudent().name,title=(nav.find(x=>x[0]===tab)||nav[0])[2];let mainNav=trainer?MAIN_NAV_TRAIN:MAIN_NAV_STU;return `<div class="dashboard ${!trainer?'student-dashboard':''}"><aside class="sidebar">${pulseSidebarBrand(trainer?'PERSONAL OS':'ÁREA DO ALUNO')}<span class="sidebar-section">MENU PRINCIPAL</span><nav class="sidebar-nav">${nav.slice(0,trainer?8:5).map(([p,ic,t])=>`<button title="${t}" class="side-link ${p===tab?'active':''}" data-go="/${role}/${p}">${ico(ic,19)}<span>${t}</span></button>`).join('')}</nav><span class="sidebar-section">SUPORTE E CONTA</span><nav class="sidebar-nav">${nav.slice(trainer?8:5).map(([p,ic,t])=>`<button title="${t}" class="side-link ${p===tab?'active':''}" data-go="/${role}/${p}">${ico(ic,19)}<span>${t}</span>${p==='mensagens'?'<small class="nav-count">3</small>':''}</button>`).join('')}</nav><div class="side-spacer"></div>${trainer?`<div class="side-upgrade"><span>${ico('lightning',18)}</span><h4>Mais controle, mais resultado.</h4><p>Convide alunos para testar a experiência no aplicativo.</p><button data-action="copy-student-link">Copiar link do aluno ${ico('arrowRight',12)}</button></div>`:`<div class="side-upgrade"><span>${ico('award',18)}</span><h4>Uma repetição de cada vez.</h4><p>Seu esforço de hoje constrói os resultados de amanhã.</p></div>`}<div class="sidebar-user">${av(userName,trainer?'avatar-yellow':currStudent().color)}<div style="min-width:0;overflow:hidden"><strong style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(userName)}</strong><small>${trainer?'Personal trainer':'Aluno PULSE'}</small></div><button class="logout-icon" data-action="logout" title="Sair">${ico('logout',16)}</button></div></aside><div class="main-area"><header class="topbar"><div class="topbar-breadcrumb"><div class="mobile-top-logo">${pulseLogo('topbar-icon')}</div><span class="crumb-prefix">${trainer?'Painel':'Meu espaço'} &nbsp; / </span><b>${title}</b></div><div class="top-actions"><div class="top-date">${ico('calendar',15)} ${dateBR(today,{weekday:'long',day:'2-digit',month:'long'})}</div>${trainer?`<button class="btn btn-primary btn-sm" data-action="modal-add-student">${ico('plus',15)} Novo aluno</button>`:`<button class="btn btn-white btn-sm" data-action="switch-role">${ico('users',15)} Ver painel personal</button>`}<button class="top-icon has-dot" title="Mensagens" data-go="/${role}/mensagens">${ico('bell',17)}</button>${av(userName,trainer?'avatar-yellow':currStudent().color)}</div></header><main class="app-content">${content}</main></div><nav class="mobile-bottom-nav">${mainNav.map(p=>{const item=nav.find(x=>x[0]===p);return `<button class="mobile-nav-item ${p===tab?'active':''}" data-go="/${role}/${p}"><span class="mobile-nav-icon">${ico(item[1],19)}</span>${item[2].replace('Meus alunos','Alunos').replace('Meus treinos','Treinos').replace('Minha evolução','Evolução').replace('Meu perfil','Perfil').replace('Visão geral','Início')}</button>`}).join('')}</nav></div>${renderModal()}`}

  const inTL=x<7&&y<7,inTR=x>=18&&y<7,inBL=x<7&&y>=18;
  const localX=inTR?x-18:x,localY=inBL?y-18:y;

function enrollmentModal(id=null){const e=id?db.enrollments.find(e=>e.id===Number(id)):null;return modalShell(e?'Editar pacote contratado':'Vincular pacote ao aluno',`<form data-form="trainer-enrollment"><input name="id" type="hidden" value="${e?.id||''}"><div class="two-fields"><div class="field"><label>Aluno *</label><select class="control" name="studentId" ${e?'disabled':''}>${db.students.map(s=>`<option value="${s.id}" ${(e?.studentId||ui.studentId||1)===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Pacote *</label><select class="control" name="packageId" id="enroll-package">${db.packages.filter(p=>p.active||p.id===e?.packageId).map(p=>`<option value="${p.id}" ${(e?.packageId||db.packages[0]?.id)===p.id?'selected':''}>${esc(p.name)} · ${money(p.price)}</option>`).join('')}</select></div></div><div class="two-fields"><div class="field"><label>Valor acordado (R$) *</label><input class="control" name="price" type="number" min="1" step="0.01" required value="${e?.price??db.packages[0]?.price??0}"></div><div class="field"><label>Dia de vencimento (1 a 28)</label><input class="control" name="dueDay" type="number" min="1" max="28" required value="${e?.dueDay||10}"></div></div><div class="two-fields"><div class="field"><label>Como pretende receber</label><select class="control" name="method">${Object.entries(payMethods).map(([v,label])=>`<option value="${v}" ${e?.method===v?'selected':''}>${esc(label)}</option>`).join('')}</select></div><div class="field"><label>Status</label><select class="control" name="status">${['Ativo','Pausado','Cancelado'].map(v=>`<option ${e?.status===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="field"><label>Início do plano</label><input class="control" type="date" name="start" value="${e?.start||iso(today)}" required></div><div class="note-box">Somente registros internos. Link / fatura será gerado depois que o personal conectar o Asaas. Pacotes alterados passam a valer nos próximos ciclos; lançamentos anteriores ficam preservados.</div>${modalFooter('Salvar vínculo')}</form>`)}
function paymentConfirmationModal(kind,id){const saas=kind==='saas',v=(saas?db.saasInvoices:db.payments).find(p=>p.id===id);if(!v)return '';return modalShell('Confirmar recebimento',`<form data-form="confirm-payment"><input type="hidden" name="kind" value="${kind}"><input type="hidden" name="id" value="${id}"><div class="note-box">Confirme somente um valor que foi recebido de verdade (nesta demonstração, apenas será marcado como pago).<br><strong>${money(v.amount)}</strong> • ${dateBR(parseISO(v.date),{day:'2-digit',month:'long',year:'numeric'})}</div><div class="field"><label>Forma do recebimento</label><select class="control" name="method">${Object.entries(payMethods).filter(([k])=>k!=='link').map(([k,label])=>`<option value="${k}" ${v.method===k?'selected':''}>${esc(label)}</option>`).join('')}</select></div><div class="field"><label>Data do pagamento</label><input class="control" type="date" name="paidAt" value="${iso(today)}" required></div><div class="field"><label>Observação / comprovante</label><textarea name="notes" maxlength="220" class="control textarea" placeholder="Referência opcional, registrada somente no navegador"></textarea></div>${modalFooter('Confirmar recebimento')}</form>`)}
function getStudentLink(id=null){return location.href.split('#')[0]+'#/login/aluno'+(id?'/'+id:'');}
function modalShell(title,body){return `<div class="modal-backdrop" data-dismiss="modal"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><button type="button" class="modal-close" title="Fechar" data-action="close-modal">${ico('close',18)}</button></div><div class="modal-body">${body}</div></div></div>`}
const modalFooter=(submit='Salvar')=>`<div class="modal-foot"><button type="button" class="btn btn-white" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">${ico('check',16)} ${submit}</button></div>`;

nha automaticamente.'}</div>${modalFooter(edit?'Salvar aluno':'Cadastrar aluno')}</form>`;return modalShell(edit?'Editar aluno':'Cadastrar novo aluno',form)}
function workoutForm(){return modalShell('Criar treino personalizado',`<form data-form="add-workout"><div class="field"><label>Nome do treino *</label><input class="control" name="name" required placeholder="Ex.: Treino E — Pernas e glúteos"></div><div class="field"><label>Foco / descrição *</label><input class="control" name="focus" required placeholder="Ex.: Hipertrofia de membros inferiores"></div><div class="two-fields"><div class="field"><label>Nível</label><select class="control" name="level"><option>Iniciante</option><option selected>Intermediário</option><option>Avançado</option><option>Todos os níveis</option></select></div><div class="field"><label>Duração (minutos)</label><input class="control" type="number" min="10" max="240" name="duration" value="50" required></div></div><div class="field"><label>Dias sugeridos</label><input class="control" name="days" placeholder="Seg, Qua, Sex" value="Seg, Qua, Sex"><span class="field-desc">Separe os dias por vírgula.</span></div><div class="field"><label>Exercícios (um por linha) *</label><textarea class="control textarea" style="min-height:120px" name="exercises" required placeholder="Agachamento livre, 4, 12, 60 seg&#10;Leg press, 3, 15, 60 seg"></textarea><span class="field-desc">Formato por linha: Nome, séries, repetições, descanso. Ex.: Agachamento, 4, 12, 90 seg</span></div>${modalFooter('Criar treino')}</form>`)}
function assignForm(){const desiredStudent=ui.studentId||currStudent().id,desiredWorkout=ui.workoutId||db.workouts[0]?.id;return modalShell('Vincular treino ao aluno',`<form data-form="assign-workout"><div class="field"><label>Aluno</label><select class="control" name="studentId" required>${db.students.map(s=>`<option value="${s.id}" ${s.id===desiredStudent?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Treino para vincular</label><select class="control" name="workoutId" required>${db.workouts.map(w=>`<option value="${w.id}" ${w.id===desiredWorkout?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div><div class="note-box">O treino aparecerá imediatamente na área do aluno de demonstração quando vinculado ao perfil de Marina.</div>${modalFooter('Vincular treino')}</form>`)}
function sessionForm(){return modalShell('Agendar nova sessão',`<form data-form="add-session"><div class="field"><label>Aluno *</label><select class="control" name="studentId" required>${db.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="two-fields"><div class="field"><label>Data *</label><input class="control" type="date" name="date" required value="${ui.agendaDay}"></div><div class="field"><label>Horário *</label><input class="control" type="time" name="time" required value="08:00"></div></div><div class="field"><label>Tipo de atendimento</label><select class="control" name="type"><option>Treino presencial</option><option>Avaliação física</option><option>Acompanhamento online</option><option>Reavaliação</option></select></div>${modalFooter('Agendar sessão')}</form>`)}
function paymentForm(){return modalShell('Novo lançamento financeiro',`<form data-form="add-payment"><div class="field"><label>Aluno *</label><select class="control" name="studentId" required>${db.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Descrição</label><input class="control" name="description" maxlength="90" placeholder="Ex.: Mensalidade outubro" value="Mensalidade"></div><div class="two-fields"><div class="field"><label>Valor (R$) *</label><input class="control" type="number" name="amount" min="1" max="100000" step="0.01" placeholder="190.00" required></div><div class="field"><label>Data *</label><input class="control" type="date" name="date" required value="${iso(today)}"></div></div><div class="two-fields"><div class="field"><label>Meio de cobrança</label><select class="control" name="method">${Object.entries(payMethods).map(([v,k])=>`<option value="${v}">${esc(k)}</option>`).join('')}</select></div><div class="field"><label>Status</label><select class="control" name="status"><option>Pendente</option><option>Pago</option></select></div></div><div class="note-box">Este lançamento registra apenas uma informação de teste. Não existe cobrança ou transação financeira.</div>${modalFooter('Salvar lançamento')}</form>`)}
function weightForm(){return modalShell('Registrar meu peso',`<form data-form="add-weight"><div class="two-fields"><div class="field"><label>Data da medição</label><input class="control" type="date" name="date" max="${iso(today)}" value="${iso(today)}" required></div><div class="field"><label>Peso (kg) *</label><input class="control" type="number" name="weight" min="20" max="350" step="0.1" value="${currStudent().weight||''}" required></div></div><div class="note-box">O registro é somente demonstrativo. A interpretação de medidas corporais deve ser individualizada por profissionais habilitados.</div>${modalFooter('Registrar peso')}</form>`)}
function renderModal(){if(ui.modal==='admin-plan')return adminPlanModal(ui.editId);if(ui.modal==='admin-trainer')return adminTrainerModal(ui.editId);if(ui.modal==='trainer-package')return packageModal(ui.editId);if(ui.modal==='trainer-enrollment')return enrollmentModal(ui.editId);if(ui.modal==='confirm-payment')return paymentConfirmationModal(ui.paymentKind,ui.editId);switch(ui.modal){case 'add-student':return studentForm(null);case 'edit-student':return studentForm(student(ui.studentId));case 'add-workout':return workoutForm();case 'add-session':return sessionForm();case 'assign-workout':return assignForm();case 'add-payment':return paymentForm();case 'add-weight':return weightForm();default:return ''}}
function trainerPage(tab){if(trainerBy(1)?.status!=='Ativo')return shell('treinador',tab,`${sectionHeader('Assinatura indisponível','Seu acesso está pausado na demonstração.') }<div class="card-box card-pad"><h2>Plano PULSE ${esc(trainerBy(1)?.status||'inativo')}</h2><p>O acesso ao sistema foi limitado pela administração. Entre em contato com o suporte da PULSE para verificar sua assinatura.</p></div>`);let content;if(tab==='alunos')content=ui.studentId?studentDetail():trainerStudents();else if(tab==='treinos')content=ui.workoutId?workoutDetail():trainerWorkouts();else content=({'visao-geral':trainerOverview,'avaliacoes':trainerAssessments,'agenda':trainerAgenda,'evolucao':trainerEvolution,'pacotes':trainerPackages,'financeiro':trainerFinance,'whatsapp':()=>waPage('trainer'),'mensagens':trainerMessages,'configuracoes':trainerSettings}[tab]||trainerOverview)();return shell('treinador',tab,content)}
function studentPage(tab){let content=({'inicio':stuOverview,'meus-treinos':stuWorkouts,'evolucao':stuEvolution,'agenda':stuAgenda,'mensalidades':stuBilling,'mensagens':()=>messagesUI('aluno'),'perfil':stuProfile}[tab]||stuOverview)();return shell('aluno',tab,content)}
function render(){let p=path(),parts=p.split('/').filter(Boolean);document.title='PULSE — '+(p==='/'?'Personal Trainer OS':(parts.at(-1)||'Painel').replaceAll('-',' '));const app=$('#app');let html;if(p==='/'||parts[0]==='home'||p===''){html=marketing()}else if(parts[0]==='login'){html=auth(parts[1]==='aluno'?'aluno':parts[1]==='admin'?'admin':'treinador',Number(parts[2])||null)}else if(parts[0]==='admin'&&PATHS.admin.includes(parts[1])){html=session?.role==='admin'?adminPage(parts[1]):auth('admin')}else if(parts[0]==='treinador'&&PATHS.treinador.includes(parts[1])){html=session?.role==='treinador'?trainerPage(parts[1]):auth('treinador')}else if(parts[0]==='aluno'&&PATHS.aluno.includes(parts[1])){html=session?.role==='aluno'?studentPage(parts[1]):auth('aluno')}else{html=marketing()}app.innerHTML=html;const msgs=$('#conversation-msgs');if(msgs)msgs.scrollTop=msgs.scrollHeight;}
function copyToClipboard(str){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(str).then(()=>notify('Endereço copiado!')).catch(()=>window.prompt('Copie o endereço abaixo:',str));}else{window.prompt('Copie o endereço abaixo:',str);}}
function clickAction(node){const action=node.dataset.action,id=Number(node.dataset.id),r=path();switch(action){
 case 'demo-login':login(['aluno','admin'].includes(node.dataset.role)?node.dataset.role:'treinador',id||1);break;
 case 'logout':logout();break;
 case 'switch-role':login('treinador');break;
 case 'go-marketing':route('/');break;
 case 'goto-student-workouts':route('/aluno/meus-treinos');break;
 case 'modal-add-student':ui.modal='add-student';render();break;
 case 'eval-open-student':openAssessment(id,null,'list');break;
 case 'eval-new':openAssessment(id,null,'new');break;
 case 'eval-edit':openAssessment(null,id,'edit');break;
 case 'eval-report':openAssessment(null,id,'report');break;
 case 'eval-list':evalCapture();ui.evalMode='list';ui.evalId=null;render();break;
 case 'eval-overview':evalCapture();ui.evalMode='list';ui.evalId=null;ui.evalStudentId=null;render();break;
 case 'eval-step':evalCapture();ui.evalMode='edit';ui.evalStep=Number(node.dataset.step);render();break;
 case 'eval-next':evalCapture();ui.evalStep=Math.min(EVAL_STEPS.length,ui.evalStep+1);render();break;
 case 'eval-prev':evalCapture();ui.evalStep=Math.max(0,ui.evalStep-1);render();break;
 case 'eval-save':evalCapture();render();notify('Rascunho da avaliação salvo neste navegador.');break;
 case 'eval-finish':evalFinish();break;
 case 'eval-share':{const a=assessBy(id);if(a){a.shared=!a.shared;save();render();notify(a.shared?'Resumo liberado na demonstração da área do aluno.':'Compartilhamento desativado.');}break;}
 case 'eval-print':window.print();break;
 case 'eval-add-for-selected':openAssessment(ui.evalStudentId||db.students[0]?.id,null,'new');break;
 case 'eval-select-student':ui.evalStudentId=id;ui.evalMode='list';ui.evalId=null;render();break;
 case 'modal-edit-student':ui.studentId=id;ui.modal='edit-student';render();break;
 case 'modal-add-workout':ui.modal='add-workout';render();break;
 case 'modal-add-session':ui.modal='add-session';render();break;
 case 'modal-add-payment':ui.modal='add-payment';render();break;
 case 'admin-new-plan':ui.editId=null;setModal('admin-plan');break;
 case 'admin-edit-plan':ui.editId=id;setModal('admin-plan');break;
 case 'admin-new-trainer':ui.editId=null;setModal('admin-trainer');break;
 case 'admin-edit-trainer':ui.editId=id;setModal('admin-trainer');break;
 case 'trainer-new-package':ui.editId=null;setModal('trainer-package');break;
 case 'trainer-edit-package':ui.editId=id;setModal('trainer-package');break;
 case 'trainer-new-enrollment':ui.editId=null;setModal('trainer-enrollment');break;
 case 'trainer-enrollment':ui.editId=id;setModal('trainer-enrollment');break;
 case 'open-confirm-student':ui.editId=id;ui.paymentKind='student';setModal('confirm-payment');break;
 case 'open-confirm-saas':ui.editId=id;ui.paymentKind='saas';setModal('confirm-payment');break;
 case 'go-admin-subscriptions':route('/admin/assinaturas');break;
 case 'demo-open-trainer-finance':login('treinador');route('/treinador/financeiro');break;
 case 'wa-show-qr':{const role=node.dataset.role;ui.waQrOpen[role]=!ui.waQrOpen[role];render();break;}
 case 'wa-demo-pair':{const role=node.dataset.role;waState(role).connectedDemo=true;ui.waQrOpen[role]=false;save();render();notify('Conectado apenas na demonstração. Nenhum WhatsApp real foi vinculado.');break;}
 case 'wa-demo-disconnect':{const role=node.dataset.role;waState(role).connectedDemo=false;ui.waQrOpen[role]=false;save();render();notify('Conexão demonstrativa encerrada.');break;}
 case 'wa-select-template':{const role=node.dataset.role;ui.waTemplate[role]=node.dataset.key;render();break;}
 case 'wa-test-message':{const role=node.dataset.role,key=ui.waTemplate[role],who=waSelected(role),state=waState(role),text=$('[data-form="wa-template"] [name="text"]')?.value||state.templates[key];const msg=waFormat(role,text,who);state.history.unshift({id:rndId(),recipient:who.name,label:WA_TITLES[role][key][0],text:msg,date:new Date().toLocaleString('pt-BR'),simulation:true});state.history=state.history.slice(0,30);save();render();notify('Mensagem simulada e registrada no histórico. Nenhum WhatsApp foi enviado.');break;}
 case 'admin-billing':{const count=generateBilling();render();notify(count?count+' cobranças geradas.':'A competência atual já foi gerada, sem duplicação.');break;}
 case 'modal-add-weight':ui.modal='add-weight';render();break;
 case 'modal-assign-workout':if(node.dataset.id)ui.studentId=id;if(node.dataset.workout)ui.workoutId=Number(node.dataset.workout);ui.modal='assign-workout';render();break;
 case 'close-modal':ui.modal=null;render();break;
 case 'copy-student-link':copyToClipboard(getStudentLink(id||null));break;
 case 'student-detail':ui.studentId=id;ui.workoutId=null;ui.modal=null;if(r!=='/treinador/alunos')route('/treinador/alunos');else render();window.scrollTo(0,0);break;
 case 'close-detail':ui.studentId=null;render();break;
 case 'toggle-student-status':{const s=student(id);if(s){s.status=s.status==='Ativo'?'Pausado':'Ativo';save();render();notify('Situação do aluno atualizada.')}break;}
 case 'workout-detail':ui.workoutId=id;render();window.scrollTo(0,0);break;
 case 'close-workout':ui.workoutId=null;render();break;
 case 'filter-students':ui.filter=node.dataset.filter;render();break;
 case 'week-prev':ui.agendaWeek-=1;syncWeek();render();break;
 case 'week-next':ui.agendaWeek+=1;syncWeek();render();break;
 case 'week-current':ui.agendaWeek=0;ui.agendaDay=iso(today);render();break;
 case 'set-agenda-day':ui.agendaDay=node.dataset.day;render();break;
 case 'mark-paid':ui.editId=id;ui.paymentKind='student';setModal('confirm-payment');break;
 case 'select-student-workout':ui.studentWorkoutId=id;render();break;
 case 'toggle-exercise':{const wid=Number(node.dataset.workout),index=Number(node.dataset.index),done=completedForWorkout(wid);db.completed[done.key]=done.completed.includes(index)?done.completed.filter(n=>n!==index):[...done.completed,index];save();render();if(db.completed[done.key].length===done.total)notify('Treino completo! Excelente trabalho!');break;}

const EVAL_RISK_KEYS=['chestPain','syncope','dyspnea','healthCondition','pain','pregnancy'];
function evalEntries(sid){return (db.assessments||[]).filter(a=>Number(a.studentId)===Number(sid)).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.id-a.id));}
function assessBy(id){return db.assessments.find(a=>a.id===Number(id));}
function evalLatest(id){return evalEntries(id).find(a=>a.status==='Concluída')||evalEntries(id)[0];}
function assessmentBadge(id){const a=evalLatest(id);if(!a)return `<span class="tag tag-gray">Não avaliado</span>`;return a.status==='Concluída'?`<span class="tag tag-green">${ico('check',13)} Avaliado</span>`:`<span class="tag tag-yellow">Rascunho</span>`;}
function assessmentIntro(id){const last=evalLatest(id);return last?`${last.status==='Concluída'?'Última avaliação concluída':'Existe um rascunho'} em ${dateBR(parseISO(last.date),{day:'2-digit',month:'2-digit',year:'numeric'})}. ${evalEntries(id).length} registro(s) no histórico.`:'Nenhuma avaliação registrada. Inicie uma anamnese e uma avaliação física antes da prescrição.';}
function evSafeVal(v){return v===null||v===undefined?'':String(v);}
function evalRisk(data){const found=EVAL_RISK_KEYS.filter(k=>{const v=String(data?.[k]||'');return v==='Sim'||v==='Não sei'});return {count:found.length,flagged:found,needsReview:found.length>0};}
function evalDataCount(data){return Object.values(data||{}).filter(v=>v!==''&&v!==null&&v!==undefined).length;}
function openAssessment(sid,aid,mode='list'){
 if(session?.role!=='treinador'){notify('Acesso exclusivo do personal nesta demonstração.');return;}
 let a=aid?assessBy(aid):null;if(a) sid=a.studentId;
 if(!student(sid)){notify('Selecione um aluno válido.');return;}
 ui.evalStudentId=Number(sid);ui.evalMode=mode;ui.evalStep=0;ui.evalId=null;
 if(mode==='new'){
  a={id:rndId(),studentId:Number(sid),date:iso(today),createdAt:new Date().toISOString(),type:'Avaliação inicial',status:'Rascunho',shared:false,data:{goal:student(sid)?.goal||'',type:evalEntries(sid).some(x=>x.status==='Concluída')?'Reavaliação':'Avaliação inicial',weight:evSafeVal(student(sid)?.weight),height:student(sid)?.height?String((student(sid).height*100).toFixed(1)):'',consent:'Não',share:'Não',careStatus:'Triagem pendente',professional:db.trainer.name}};
  db.assessments.push(a);save();ui.evalMode='edit';ui.evalId=a.id;
 }else if(a){ui.evalId=a.id;ui.evalMode=mode==='report'?'report':'edit';}
 if(path()!=='/treinador/avaliacoes')route('/treinador/avaliacoes');else render();window.scrollTo(0,0);
}
function evalCapture(announce=false){
 const form=$('#eval-step-form');const a=assessBy(ui.evalId);if(!form||!a||ui.evalMode!=='edit')return;
 for(const el of $$('[data-eval-field]',form)){
  const key=el.name;const value=el.type==='checkbox'?(el.checked?'Sim':'Não'):String(el.value||'').trim();
  a.data[key]=value;
 }
 a.type=a.data.type||a.type;a.updatedAt=new Date().toISOString();save();
 if(announce)notify('Etapa salva no navegador.');
}
function evalFinish(){
 evalCapture();const a=assessBy(ui.evalId);if(!a)return;
 if(a.data.consent!=='Sim'||!a.data.consentDate){ui.evalStep=EVAL_STEPS.length-1;render();notify('Registre a autorização/base legal e a data antes de concluir.');return;}
 if(!a.data.goal){ui.evalStep=0;render();notify('Informe ao menos um objetivo do acompanhamento.');return;}
 a.status='Concluída';a.type=a.data.type||a.type;a.shared=a.data.share==='Sim';a.finishedAt=new Date().toISOString();save();ui.evalMode='report';render();notify('Avaliação registrada. Isso não constitui liberação clínica.');
}
function evalInput(field,value){
 const v=esc(evSafeVal(value)),extra=(field.min!==undefined?` min="${field.min}"`:'')+(field.max!==undefined?` max="${field.max}"`:'')+(field.step!==undefined?` step="${field.step}"`:'');
 const attrs=`name="${field.key}" data-eval-field="1" id="eval-${field.key}"`;
 let control;
 if(field.type==='select')control=`<select class="control" ${attrs}><option value="">Selecione...</option>${field.options.map(x=>`<option value="${esc(x)}" ${String(value||'')===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
 else if(field.type==='textarea')control=`<textarea class="control textarea" ${attrs} maxlength="1800" rows="3" placeholder="Descreva de forma objetiva...">${v}</textarea>`;
 else control=`<input class="control" type="${field.type==='date'?'date':field.type==='number'?'number':'text'}" ${attrs} ${extra} maxlength="500" value="${v}" placeholder="${field.type==='number'?'Ex.: 75.5':''}">`;
 return `<div class="field eval-field ${field.span?'eval-field-full':''}"><label for="eval-${field.key}">${esc(field.label)}${field.risk?'<span class="eval-risk-star"> • triagem</span>':''}</label><div class="eval-input-wrap">${control}${field.unit?`<span class="eval-unit">${esc(field.unit)}</span>`:''}</div></div>`;
}
function evalStepPage(a){
 const step=EVAL_STEPS[ui.evalStep];const risk=evalRisk(a.data);
 const groups=step.groups.map(g=>`<section class="card-box eval-step-card"><div class="eval-section-title"><h3>${esc(g.title)}</h3>${g.desc?`<p>${esc(g.desc)}</p>`:''}</div><div class="eval-fields">${g.fields.map(f=>evalInput(f,a.data[f.key])).join('')}</div></section>`).join('');
 return `<div class="eval-workspace-header"><div><span class="eval-eyebrow">ETAPA ${ui.evalStep+1} DE ${EVAL_STEPS.length}</span><h2>${ico(step.icon,23)} ${esc(step.title)}</h2><p>${esc(step.sub)}</p></div><div class="eval-status">${statusTag(a.status)}<small>${evalDataCount(a.data)} campos registrados</small></div></div>
 ${ui.evalStep===1?`<div class="eval-warning">${ico('shield',18)} <div><strong>Triagem não é diagnóstico nem liberação automática.</strong><span>Respostas positivas ou incertas precisam de análise individual e podem justificar encaminhamento. Não aplique testes potencialmente inadequados durante sintomas.</span></div></div>`:''}
 ${ui.evalStep>1&&risk.needsReview?`<div class="eval-warning">${ico('info',18)} <div><strong>${risk.count} ponto(s) de atenção na triagem.</strong><span>Registre a conduta e avalie a necessidade de orientação especializada antes de testes ou prescrição.</span></div></div>`:''}
 <form id="eval-step-form" data-form="assessment">${groups}${ui.evalStep===2?evalLegacyMeasures(a.data):''}<div class="eval-form-footer"><button type="button" class="btn btn-white" data-action="eval-prev" ${ui.evalStep===0?'disabled':''}>${ico('arrowLeft',15)} Anterior</button><span class="eval-form-save">${ico('checkCircle',15)} Salvo no navegador ao trocar de etapa</span><div><button type="button" class="btn btn-outline" data-action="eval-save">Salvar rascunho</button><button type="button" class="btn btn-primary" data-action="eval-next">Próxima etapa ${ico('arrowRight',15)}</button></div></div></form>`;
}
const EVAL_MEASURES=[['weight','Peso','kg'],['waist','Cintura','cm'],['hip','Quadril','cm'],['armRight','Braço direito','cm'],['armLeft','Braço esquerdo','cm'],['chestExpanded','Tórax expandido','cm'],['chestRelaxed','Tórax relaxado','cm'],['thigh','Coxa','cm'],['bodyFat','Gordura corporal (%)','%'],['strengthResult','Teste de força',''],['mobilityResult','Teste de flexibilidade','']];
const EVAL_LEGACY_MEASURES=[['chest','Tórax (registro anterior; fase não informada)','cm'],['arm','Braço relaxado (registro anterior; lado não informado)','cm'],['armFlex','Braço contraído (registro anterior; lado não informado)','cm']];
const EVAL_COMPARISON_MEASURES=[...EVAL_MEASURES,...EVAL_LEGACY_MEASURES];
function evalCompare(sid,a){
 const history=evalEntries(sid).filter(x=>x.status==='Concluída').sort((x,y)=>x.date.localeCompare(y.date));const at=history.findIndex(x=>x.id===a.id);const prev=at>0?history[at-1]:null;
 if(!prev)return `<p class="muted small">Conclua uma reavaliação para comparar as medidas entre datas diferentes.</p>`;
 const rows=EVAL_COMPARISON_MEASURES.filter(([k])=>a.data[k]!==undefined&&a.data[k]!==''&&prev.data[k]!==undefined&&prev.data[k]!=='').map(([k,label,unit])=>{
  const n=Number(a.data[k]),o=Number(prev.data[k]);if(!Number.isFinite(n)||!Number.isFinite(o))return '';
  const delta=n-o;return `<tr><td>${esc(label)}</td><td>${fmtNumber(o)} ${unit}</td><td><b>${fmtNumber(n)} ${unit}</b></td><td>${delta>0?'+':''}${fmtNumber(delta)} ${unit}</td></tr>`;
 }).join('');
 return `<div class="eval-compare-intro">Comparação com ${dateBR(parseISO(prev.date),{day:'2-digit',month:'2-digit',year:'numeric'})}. Mudanças numéricas, sem interpretação clínica automática.</div><div class="table-container"><table class="data-table"><thead><tr><th>Medida</th><th>Anterior</th><th>Atual</th><th>Diferença</th></tr></thead><tbody>${rows||'<tr><td colspan="4">Não há medidas comparáveis registradas.</td></tr>'}</tbody></table></div>`;
}
function evalLegacyMeasures(data){
 const rows=EVAL_LEGACY_MEASURES.filter(([key])=>data[key]!==undefined&&data[key]!==''&&data[key]!==null);
 if(!rows.length)return '';
 return `<section class="card-box eval-step-card"><div class="eval-section-title"><h3>Medidas do formato anterior</h3><p>Os valores abaixo foram preservados. Como o registro antigo não separava os lados dos braços nem indicava a fase do tórax, eles não foram convertidos automaticamente para evitar atribuir um lado ou protocolo incorreto.</p></div><div class="eval-review-grid">${rows.map(([key,label,unit])=>`<div><small>${esc(label)}</small><b>${esc(data[key])}${unit?' '+esc(unit):''}</b></div>`).join('')}</div></section>`;
}
function evalComputed(data){const weight=Number(data.weight),height=Number(data.height)/100;const bmi=(weight>0&&height>0)?weight/(height*height):null;const waist=Number(data.waist),hip=Number(data.hip);return `<div class="eval-metrics"><div class="eval-metric"><small>IMC aritmético</small><strong>${bmi?fmtNumber(bmi,1):'—'}</strong><span>kg/m² · não é diagnóstico</span></div><div class="eval-metric"><small>Relação cintura/quadril</small><strong>${waist>0&&hip>0?fmtNumber(waist/hip,2):'—'}</strong><span>Relação matemática, sem classificação</span></div><div class="eval-metric"><small>Medidas registradas</small><strong>${EVAL_COMPARISON_MEASURES.filter(x=>data[x[0]]).length}</strong><span>Variáveis do acompanhamento</span></div></div>`;}

 ${evalComputed(a.data)}

 ${evalLegacyMeasures(a.data)}
 <section class="card-box eval-step-card"><div class="eval-section-title"><h3>Comparação de reavaliações</h3></div>${evalCompare(a.studentId,a)}</section>

 <div class="eval-alert-summary ${risk.needsReview?'alert':''}"><span>${ico(risk.needsReview?'info':'shield',20)}</span><div><strong>${risk.needsReview?'Atenção: dados de triagem exigem análise profissional':'Registro de triagem sem alerta positivo informado'}</strong><p>Nenhum resultado da PULSE constitui liberação médica, diagnóstico ou classificação de risco automatizada.</p></div></div>${evalComputed(a.data)}
 ${EVAL_STEPS.map(st=>{const groups=st.groups.map(g=>{const items=g.fields.filter(f=>a.data[f.key]!==''&&a.data[f.key]!==undefined&&a.data[f.key]!==null);return items.length?`<div class="eval-report-group"><h4>${esc(g.title)}</h4><div class="eval-review-grid">${items.map(f=>`<div><small>${esc(f.label)}</small><b>${esc(a.data[f.key])}${f.unit?' '+esc(f.unit):''}</b></div>`).join('')}</div></div>`:''}).join('');return groups?`<section class="card-box eval-step-card"><div class="eval-section-title"><h3>${ico(st.icon,18)} ${esc(st.title)}</h3></div>${groups}</section>`:''}).join('')}
 ${evalLegacyMeasures(a.data)}

" data-action="eval-print">${ico('download',15)} Imprimir / salvar PDF</button></div></div>${evalReportPage(a)}`:ui.evalStep===EVAL_STEPS.length?evalReviewPage(a):evalStepPage(a)}</div></div>`;}

function p5ThumbUrl(file){return P5_THUMB_DATA[file]||'';}
function p5Visual(x,variant=''){const poster=p5ThumbUrl(p5ThumbFile(x)),video=x?.video||P5_VIDEO_MAP[String(x?.name||'').toLocaleLowerCase('pt-BR')];const media=video?`<video class="p5-media" muted loop playsinline preload="metadata" poster="${esc(poster)}"><source src="${esc(video)}" type="video/mp4"></video>`:`<img class="p5-media" src="${esc(poster)}" alt="Miniatura de ${esc(x?.name||'exercício')}" loading="lazy" decoding="async">`;return `<div class="p5-ex-visual ${variant}">${media}</div>`;}
ui.p5Tab='fichas';ui.p5Filter={search:'',group:'Todos',equipment:'Todos',level:'Todos'};ui.p5Builder=null;ui.p5LibQuery='';ui.p5LibGroup='Todos';
const p5DraftKey=KEY+'-p5-draft';
try {const persisted=JSON.parse(store.getItem(p5DraftKey));if(persisted&&Array.isArray(persisted.exercises)&&['new','edit','copy'].includes(persisted.mode))ui.p5Builder=persisted;}catch{}
function p5StoreDraft(){if(ui.p5Builder)store.setItem(p5DraftKey,JSON.stringify(ui.p5Builder));else store.removeItem(p5DraftKey)}
function p5Begin(mode='new',id=null,sid=null){let base=workout(id),draft;if(base){draft=JSON.parse(JSON.stringify(base));draft.exercises=(draft.exercises||[]).map(p5Norm);}else{draft={name:'',focus:'',level:'Iniciante',duration:50,days:['Seg','Qua','Sex'],notes:'',periodWeeks:8,studentId:0,exercises:[]};}
 if(mode==='copy'){delete draft.id;draft.name=(draft.name||'Treino')+' • personalizado';}
 if(mode==='new')delete draft.id;
 if(sid!==null&&sid!==undefined)draft.studentId=Number(sid);
 ui.p5Builder={mode,sourceId:id||null,...draft};ui.workoutId=null;ui.p5Tab='fichas';ui.p5LibQuery='';ui.p5LibGroup='Todos';p5StoreDraft();route('/treinador/treinos');render();window.scrollTo(0,0);}
function p5CloseBuilder(){ui.p5Builder=null;p5StoreDraft();render()}
function p5Field(label,name,value,type='text',extra=''){return `<label class="p5-field"><span>${esc(label)}</span><input class="control" data-p5-plan="${esc(name)}" type="${type}" value="${esc(value??'')}" ${extra}></label>`}
function p5Opt(arr,current){return arr.map(x=>`<option value="${esc(x)}" ${String(x)===String(current)?'selected':''}>${esc(x)}</option>`).join('')}
function p5Select(label,name,opts,val){return `<label class="p5-field"><span>${esc(label)}</span><select class="control" data-p5-plan="${esc(name)}">${p5Opt(opts,val)}</select></label>`}
function p5LibraryTile(x,builder=false){return `<article class="p5-ex">${p5Visual(x)}<div class="p5-ex-body"><strong>${esc(x.name)}</strong><div class="p5-chips"><span>${esc(x.group)}</span><span>${esc(x.equipment)}</span><span>${esc(x.level)}</span>${x.custom?'<span>Personalizado</span>':''}</div><p>${esc(x.cue||'Orientação técnica a definir pelo profissional.')}</p></div><button class="btn btn-primary btn-sm" data-p5="${builder?'add':'use'}" data-id="${esc(x.id)}" title="${builder?'Adicionar à ficha':'Começar ficha com este exercício'}">${ico('plus',15)} ${builder?'Adicionar':'Usar'}</button></article>`}
function p5CatalogFiltered(builder=false){let q=(builder?ui.p5LibQuery:ui.p5Filter.search).toLocaleLowerCase('pt-BR').trim(),group=builder?ui.p5LibGroup:ui.p5Filter.group,equip=builder?'Todos':ui.p5Filter.equipment,level=builder?'Todos':ui.p5Filter.level;return p5All().filter(x=>(group==='Todos'||x.group===group)&&(equip==='Todos'||x.equipment===equip)&&(level==='Todos'||x.level===level)&&(!q||[x.name,x.group,x.equipment,x.pattern].join(' ').toLocaleLowerCase('pt-BR').includes(q)));}
function p5LibraryResults(builder=false){let a=p5CatalogFiltered(builder);return `<div class="p5-results-head"><strong>${a.length} exercícios encontrados</strong><span>Catálogo ilustrativo • prescrição a critério do profissional</span></div><div class="p5-library-list">${a.slice(0,builder?35:a.length).map(x=>p5LibraryTile(x,builder)).join('')||'<div class="card-box empty-state">Nenhum exercício com esses filtros.</div>'}</div>${builder&&a.length>35?'<p class="muted small">Refine a busca para exibir mais resultados.</p>':''}`}
function p5Catalog(){let eq=['Todos',...new Set(p5All().map(x=>x.equipment))].sort((a,b)=>a.localeCompare(b,'pt-BR'));return `${sectionHeader('Biblioteca de exercícios','Movimentos organizados por grupo muscular, padrão, equipamento e nível.','<button class="btn btn-primary" data-p5="custom">'+ico('plus',16)+' Criar exercício próprio</button>')}<div class="p5-note">${ico('shield',17)} <span>Biblioteca autoral de exemplos amplamente utilizados. Não equivale a certificado técnico individual. Confira a avaliação física e adapte a prescrição para cada aluno.</span></div><div class="p5-filter-panel"><label class="p5-field p5-search"><span>Buscar movimento</span><input class="control" id="p5-cat-search" placeholder="Ex.: agachamento, remada, esteira…" value="${esc(ui.p5Filter.search)}"></label><label class="p5-field"><span>Grupo muscular</span><select id="p5-cat-group" class="control">${p5Opt(P5_GROUPS,ui.p5Filter.group)}</select></label><label class="p5-field"><span>Equipamento</span><select id="p5-cat-equipment" class="control">${p5Opt(eq,ui.p5Filter.equipment)}</select></label><label class="p5-field"><span>Nível</span><select id="p5-cat-level" class="control">${p5Opt(['Todos','Iniciante','Intermediário','Avançado'],ui.p5Filter.level)}</select></label></div><div id="p5-cat-results">${p5LibraryResults()}</div>`}
function p5Summary(w){let sets=(w.exercises||[]).reduce((n,e)=>n+(Number(e.sets)||0),0);return `${w.exercises.length} movimentos · ${sets} séries prescritas`}
function p5ProgramCards(){return `<div class="p5-program-grid">${db.workouts.map((w,i)=>{let owner=w.ownerStudentId?student(w.ownerStudentId):null;return `<article class="card-box p5-program"><div class="p5-program-bar"><span class="p5-tag">${owner?'FICHA INDIVIDUAL':'MODELO DE TREINO'}</span><span class="p5-big-icon">${ico('dumbbell',26)}</span></div><div class="p5-program-content"><h3>${esc(w.name)}</h3><p>${esc(w.focus)}</p><div class="p5-program-meta"><span>${ico('clock',14)} ${Number(w.duration)||50} min</span><span>${ico('activity',14)} ${w.exercises.length} movimentos</span><span>${ico('calendar',14)} ${esc((w.days||[]).join(' · '))}</span></div><div class="p5-program-owner">${owner?`${ico('user',14)} Ficha de ${esc(owner.name)}`:`${ico('users',14)} Modelo reutilizável`}</div><div class="p5-card-actions"><button class="btn btn-white btn-sm" data-action="workout-detail" data-id="${w.id}">Ver ficha</button><button class="btn btn-white btn-sm" data-p5="edit" data-id="${w.id}">${ico('edit',14)} Editar</button><button class="btn btn-primary btn-sm" data-p5="duplicate" data-id="${w.id}">${ico('copy',14)} Personalizar</button></div></div></article>`}).join('')}</div>`}
const _p5_originalTrainerWorkouts=trainerWorkouts;
trainerWorkouts=function(){if(ui.p5Builder)return p5BuilderPage();const tab=ui.p5Tab;return `<div class="p5-main-tabs"><button class="${tab==='fichas'?'selected':''}" data-p5="tab" data-tab="fichas">${ico('clipboard',16)} Fichas e programas</button><button class="${tab==='catalogo'?'selected':''}" data-p5="tab" data-tab="catalogo">${ico('dumbbell',16)} Biblioteca de exercícios <span>${p5All().length}</span></button></div>${tab==='catalogo'?p5Catalog():`${sectionHeader('Fichas de treino','Prescreva sessões, personalize por aluno e acompanhe cada movimento.',b('Montar nova ficha','p5-new','btn-primary','plus'))}<div class="p5-hero"><div><span>EDITOR PROFISSIONAL DE TREINOS</span><h2>Uma ficha para cada<br><em>objetivo e evolução.</em></h2><p>Organize o treino por blocos, escolha movimentos da biblioteca, ajuste cargas e cadências, e entregue um plano individual ao aluno.</p><button class="btn btn-primary" data-p5="new">${ico('plus',16)} Montar ficha personalizada</button></div><div class="p5-hero-art"><span>${ico('dumbbell',55)}</span><div>+ ${p5All().length}<small>movimentos</small></div></div></div><div class="p5-metrics"><div><b>${db.workouts.length}</b><small>Fichas e modelos</small></div><div><b>${p5All().length}</b><small>Exercícios cadastrados</small></div><div><b>${db.workouts.filter(w=>w.ownerStudentId).length}</b><small>Fichas individuais</small></div><div><b>${db.students.length}</b><small>Alunos disponíveis</small></div></div><div class="p5-section-title"><div><h3>Programas de treino</h3><p>Edite modelos ou crie uma versão exclusiva para um aluno sem alterar os demais.</p></div><button class="btn btn-white btn-sm" data-p5="tab" data-tab="catalogo">Explorar movimentos ${ico('arrowRight',14)}</button></div>${p5ProgramCards()}`}`};
function p5BuilderRow(e,i){const attr=(field)=>`data-p5-row="${i}" data-p5-field="${field}"`;return `<article class="p5-builder-row"><div class="p5-builder-row-head"><span class="p5-order">${String(i+1).padStart(2,'0')}</span>${p5Visual(e,'p5-thumb-sm')}<div class="p5-ex-title"><strong>${esc(e.name)}</strong><small>${esc(e.group||'Sem classificação')} · ${esc(e.equipment||'Equipamento a definir')}</small></div><div class="p5-row-actions"><button type="button" title="Mover para cima" class="p5-square" data-p5="move-up" data-index="${i}" ${i===0?'disabled':''}>↑</button><button type="button" title="Mover para baixo" class="p5-square" data-p5="move-down" data-index="${i}" ${i===ui.p5Builder.exercises.length-1?'disabled':''}>↓</button><button type="button" title="Remover exercício" class="p5-square danger" data-p5="remove" data-index="${i}">${ico('close',14)}</button></div></div><div class="p5-fields p5-ex-fields">
<label class="p5-field"><span>Bloco</span><select class="control" ${attr('block')}>${p5Opt(['Aquecimento','Principal','Complementar','Finalização'],e.block)}</select></label>
<label class="p5-field"><span>Séries</span><input class="control" type="number" min="1" max="30" ${attr('sets')} value="${esc(e.sets)}"></label>
<label class="p5-field"><span>Repetições / duração</span><input class="control" ${attr('reps')} value="${esc(e.reps)}" placeholder="10–12 ou 12 min"></label>
<label class="p5-field"><span>Carga / resistência</span><input class="control" ${attr('load')} value="${esc(e.load)}" placeholder="Ex.: 16 kg / leve"></label>
<label class="p5-field"><span>Descanso</span><input class="control" ${attr('rest')} value="${esc(e.rest)}" placeholder="75 seg"></label>
<label class="p5-field"><span>Cadência</span><input class="control" ${attr('tempo')} value="${esc(e.tempo)}" placeholder="2-0-2-0"></label>
<label class="p5-field"><span>RIR (opcional)</span><input class="control" ${attr('rir')} value="${esc(e.rir)}" placeholder="Ex.: 2"></label>
<label class="p5-field"><span>Método</span><select class="control" ${attr('method')}>${p5Opt(['Tradicional','Circuito','Supersérie','Bi-set','Isometria','Intervalado','Pirâmide','Tempo controlado','Outro'],e.method)}</select></label>
<label class="p5-field p5-full"><span>Alternativa / substituição</span><input class="control" ${attr('alternative')} value="${esc(e.alternative)}" placeholder="Ex.: leg press em caso de indisponibilidade de agachamento"></label>
<label class="p5-field p5-full"><span>Orientação exclusiva deste aluno</span><textarea class="control textarea" rows="2" ${attr('notes')} placeholder="Ex.: priorizar execução, limitar amplitude e observar feedback">${esc(e.notes)}</textarea></label>
</div></article>`}
function p5BuilderPage(){let d=ui.p5Builder,owner=student(d.studentId),canEditOwner=!!d.ownerStudentId;return `${sectionHeader(d.mode==='edit'?'Editar ficha de treino':'Montar ficha personalizada','Configure a prescrição e a sequência de cada exercício.',`<button class="btn btn-white" data-p5="cancel">${ico('arrowLeft',15)} Voltar</button><button class="btn btn-primary" data-p5="save">${ico('check',16)} Salvar ficha</button>`)}<div class="p5-editor-head"><span>${ico('shield',16)} Prescrição revisada pelo personal • sem automatização clínica</span><span>${d.mode==='edit'?'Editando ficha existente':'Nova ficha • dados locais de demonstração'}</span></div><div class="p5-builder-layout"><main class="p5-builder-main"><section class="card-box p5-box"><div class="p5-box-heading"><span class="p5-number">01</span><div><h3>Dados do programa</h3><p>Personalização, período e aluno destinatário.</p></div></div><div class="p5-fields">${p5Field('Nome da ficha *','name',d.name)}${p5Field('Objetivo / foco','focus',d.focus)}${p5Select('Nível','level',['Iniciante','Intermediário','Avançado','Todos os níveis'],d.level)}${p5Field('Duração estimada (min)','duration',d.duration,'number','min="10" max="300"')}${p5Field('Ciclo planejado (semanas)','periodWeeks',d.periodWeeks||8,'number','min="1" max="52"')}<label class="p5-field"><span>Aluno destinatário</span><select class="control" data-p5-plan="studentId"><option value="0">Modelo livre (sem aluno específico)</option>${db.students.map(s=>`<option value="${s.id}" ${Number(d.studentId)===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>${p5Field('Dias de treino (separados por vírgula)','days',(d.days||[]).join(', '))}<label class="p5-field p5-full"><span>Orientações gerais e progressão</span><textarea class="control textarea" data-p5-plan="notes" rows="3" placeholder="Objetivo, progressão planejada, critérios de revisão…">${esc(d.notes||'')}</textarea></label></div>${d.mode==='edit'&&!d.ownerStudentId?'<div class="p5-care">Este modelo pode estar atribuído a vários alunos. Para personalizar sem alterar outros alunos, use a opção “Personalizar” na ficha.</div>':owner?`<div class="p5-care">Ao salvar, esta ficha ficará vinculada exclusivamente a <strong>${esc(owner.name)}</strong>.</div>`:''}</section><section class="card-box p5-box"><div class="p5-box-heading"><span class="p5-number">02</span><div><h3>Sequência de movimentos</h3><p>Altere a ordem, o bloco e todos os parâmetros de cada exercício.</p></div><div class="p5-count">${p5Summary(d)}</div></div><div class="p5-sequence">${d.exercises.map(p5BuilderRow).join('')||`<div class="p5-empty-builder">${ico('dumbbell',35)}<strong>Sua ficha ainda não tem exercícios.</strong><p>Busque movimentos na biblioteca ao lado e clique em “Adicionar”.</p></div>`}</div></section><div class="p5-builder-footer"><button class="btn btn-white" data-p5="cancel">Cancelar</button><button class="btn btn-primary" data-p5="save">${ico('checkCircle',15)} Salvar ficha ${d.exercises.length?'('+d.exercises.length+' exercícios)':''}</button></div></main><aside class="p5-builder-aside"><div class="card-box p5-pick"><div class="p5-pick-top"><div><span>ACRESCENTAR MOVIMENTOS</span><h3>Biblioteca PULSE</h3><p>${p5All().length} opções para montar sua sequência</p></div><button class="p5-add-custom" data-p5="custom" title="Criar movimento">${ico('plus',18)}</button></div><input class="control" id="p5-pick-search" placeholder="Buscar nome ou aparelho…" value="${esc(ui.p5LibQuery)}"><select class="control" id="p5-pick-group">${p5Opt(P5_GROUPS,ui.p5LibGroup)}</select><div id="p5-pick-results">${p5LibraryResults(true)}</div></div></aside></div>`}
const _p5_originalDetail=workoutDetail;
workoutDetail=function(){const w=workout(ui.workoutId);if(!w)return trainerWorkouts();return `<button class="back-btn" data-action="close-workout">${ico('arrowLeft',15)} Voltar para treinos</button>${sectionHeader(esc(w.name),`${esc(w.focus)} • ${w.exercises.length} movimentos • ${w.duration} minutos`,b('Editar ficha','p5-edit-fallback','btn-primary','edit',`data-id="${w.id}"`)+b('Personalizar para aluno','p5-copy-fallback','btn-white','copy',`data-id="${w.id}"`))}<div class="p5-detail-summary"><span>${ico('calendar',15)} ${(w.days||[]).map(esc).join(' · ')}</span><span>${ico('award',15)} ${esc(w.level)}</span><span>${ico('clock',15)} ${Number(w.periodWeeks)||8} semanas de ciclo</span>${w.ownerStudentId?`<span>${ico('user',15)} ${esc(sname(w.ownerStudentId))}</span>`:''}</div>${w.notes?`<div class="p5-care">${esc(w.notes)}</div>`:''}<div class="card-box p5-detail-card"><div class="p5-box-heading"><span class="p5-number">✓</span><div><h3>Sequência prescrita</h3><p>${p5Summary(w)}</p></div><button class="btn btn-white btn-sm" data-p5="print">${ico('download',14)} Imprimir ficha</button></div>${w.exercises.map((r,i)=>{let e=p5Norm(r);return `<div class="p5-detail-row">${p5Visual(e,'p5-thumb-detail')}<span class="p5-order">${String(i+1).padStart(2,'0')}</span><div><div class="p5-detail-title"><strong>${esc(e.name)}</strong><span class="p5-chip-yellow">${esc(e.block)}</span></div><div class="p5-detail-chips"><span>${esc(e.sets)} séries</span><span>${esc(e.reps)} rep./tempo</span><span>${esc(e.load||'Carga a ajustar')}</span><span>${esc(e.rest)} descanso</span><span>Cadência ${esc(e.tempo)}</span>${e.rir?`<span>RIR ${esc(e.rir)}</span>`:''}<span>${esc(e.method)}</span></div>${e.notes?`<p class="p5-cue">Orientação: ${esc(e.notes)}</p>`:''}${e.alternative?`<p class="p5-cue">Alternativa: ${esc(e.alternative)}</p>`:''}</div></div>`}).join('')}</div>`};
const _p5_oldStudentDetail=studentDetail;
studentDetail=function(){let orig=_p5_oldStudentDetail(),s=student(ui.studentId);if(!s)return orig;return orig+`<div class="p5-student-extra"><div><span class="p5-kicker">TREINO INDIVIDUAL</span><h3>Ficha personalizada para ${esc(s.name)}</h3><p>Monte uma programação exclusiva a partir da avaliação do aluno, ou personalize um dos modelos existentes.</p></div><button class="btn btn-primary" data-p5="new" data-student="${s.id}">${ico('plus',16)} Montar ficha do aluno</button></div>`};
const _p5_oldStuWorkouts=stuWorkouts;
stuWorkouts=function(){let wlist=(db.assignments[currStudent().id]||[]).map(workout).filter(Boolean);if(!wlist.length)return _p5_oldStuWorkouts();let chosen=workout(ui.studentWorkoutId);if(!chosen||!wlist.some(w=>w.id===chosen.id)){chosen=wlist[0];ui.studentWorkoutId=chosen.id}const comp=completedForWorkout(chosen.id),progress=Math.round(comp.completed.length/(chosen.exercises.length||1)*100);return `${sectionHeader('Meus treinos','Ficha personalizada do seu treinador, com sequência e orientações.') }<div class="workout-day-tabs">${wlist.map((w,i)=>`<button class="workout-tab ${w.id===chosen.id?'active':''}" data-action="select-student-workout" data-id="${w.id}">${esc(w.name)}<small>${esc(w.focus)}</small></button>`).join('')}</div><div class="p5-student-layout"><div class="card-box p5-student-program"><div class="p5-box-heading"><span class="p5-number">${ico('dumbbell',18)}</span><div><h3>${esc(chosen.name)}</h3><p>${esc(chosen.focus)} • ${chosen.exercises.length} exercícios • ${(chosen.days||[]).map(esc).join(' · ')}</p></div></div>${chosen.notes?`<div class="p5-care">${esc(chosen.notes)}</div>`:''}${chosen.exercises.map((raw,i)=>{const e=p5Norm(raw),done=comp.completed.includes(i);return `<article class="p5-student-ex ${done?'completed':''}"><button class="exercise-check ${done?'done':''}" data-action="toggle-exercise" data-workout="${chosen.id}" data-index="${i}" aria-label="Marcar exercício como concluído">${ico('check',15)}</button>${p5Visual(e,'p5-thumb-student')}<div class="p5-student-ex-main"><div class="p5-student-ex-heading"><strong>${i+1}. ${esc(e.name)}</strong><span>${esc(e.block)}</span></div><div class="p5-detail-chips"><span>${e.sets} × ${esc(e.reps)}</span><span>${esc(e.load||'Carga orientada pelo personal')}</span><span>Descanso ${esc(e.rest)}</span>${e.tempo?`<span>Cadência ${esc(e.tempo)}</span>`:''}${e.rir?`<span>RIR ${esc(e.rir)}</span>`:''}</div>${e.notes?`<p class="p5-cue">${esc(e.notes)}</p>`:''}${e.alternative?`<p class="p5-cue">Alternativa informada: ${esc(e.alternative)}</p>`:''}${e.cue?`<details class="p5-student-detail"><summary>Ver orientação geral do movimento</summary><p>${esc(e.cue)}</p></details>`:''}</div></article>`}).join('')}<div class="p5-care">Marque o que concluiu. Em caso de dor, sintomas ou dúvida técnica, interrompa e fale com seu treinador; a plataforma não ajusta cargas automaticamente.</div></div><div class="card-box p5-student-progress"><h3>Progresso do treino</h3><div class="p5-progress-big">${progress}%</div><div class="p5-progress-track"><span style="width:${progress}%"></span></div><p>${comp.completed.length} de ${chosen.exercises.length} exercícios concluídos hoje</p><button class="btn btn-primary" data-action="complete-workout" data-id="${chosen.id}">${ico('checkCircle',16)} Concluir treino</button><div class="p5-care">O progresso demonstrativo é armazenado neste navegador.</div></div></div>`};
const _p5_originalModal=renderModal;
renderModal=function(){if(ui.modal==='p5-custom')return p5CustomModal();return _p5_originalModal()};
function p5CustomModal(){return modalShell('Cadastrar novo movimento',`<form data-form="p5-custom"><div class="field"><label>Nome do exercício *</label><input class="control" required maxlength="90" name="name" placeholder="Ex.: remada unilateral com suporte"></div><div class="two-fields"><div class="field"><label>Grupo principal</label><select class="control" name="group">${p5Opt(P5_GROUPS.filter(x=>x!=='Todos'),'Costas')}</select></div><div class="field"><label>Equipamento</label><input class="control" maxlength="40" name="equipment" placeholder="Ex.: Halteres" required></div></div><div class="two-fields"><div class="field"><label>Nível de referência</label><select class="control" name="level">${p5Opt(['Iniciante','Intermediário','Avançado'],'Intermediário')}</select></div><div class="field"><label>Padrão motor</label><input class="control" name="pattern" maxlength="60" placeholder="Ex.: Puxar horizontal"></div></div><div class="field"><label>Instruções técnicas do profissional</label><textarea class="control textarea" name="cue" rows="3" maxlength="400" placeholder="Descrição própria da execução"></textarea></div><div class="p5-care">Movimento criado pelo personal, identificado como personalizado. A inclusão não significa validação científica ou clínica.</div>${modalFooter('Salvar exercício')}</form>`)}
function p5SaveBuilder(){const d=ui.p5Builder;if(!d)return;d.name=String(d.name||'').trim();if(!d.name){notify('Informe o nome da ficha.');return;}if(!d.exercises.length){notify('Adicione pelo menos um exercício à ficha.');return;}if(d.exercises.some(e=>!e.name||!(Number(e.sets)>=1&&Number(e.sets)<=30))){notify('Confira nome e número de séries dos exercícios.');return;}if(d.studentId && !student(d.studentId)){notify('Aluno selecionado não existe.');return;}const clean=JSON.parse(JSON.stringify(d));const existing=d.mode==='edit'&&d.id?workout(d.id):null;const forkFromShared=!!(existing&&!existing.ownerStudentId&&Number(d.studentId)>0);const id=existing&&!forkFromShared?Number(d.id):rndId();delete clean.mode;delete clean.sourceId;clean.id=id;clean.studentId=Number(clean.studentId)||0;clean.ownerStudentId=clean.studentId||null;delete clean.studentId;clean.periodWeeks=Math.min(52,Math.max(1,Number(clean.periodWeeks)||8));clean.duration=Math.min(300,Math.max(10,Number(clean.duration)||50));clean.days=Array.isArray(clean.days)?clean.days:String(clean.days||'').split(',').map(x=>x.trim()).filter(Boolean);clean.level=clean.level||'Iniciante';clean.icon='dumbbell';clean.students=clean.ownerStudentId?1:0;clean.exercises=clean.exercises.map(p5Norm);let pos=db.workouts.findIndex(w=>w.id===id);if(pos>=0)db.workouts[pos]=clean;else db.workouts.push(clean);if(pos>=0){for(const [sid,ids] of Object.entries(db.assignments)){if(clean.ownerStudentId&&Number(sid)!==clean.ownerStudentId&&ids.includes(id)){db.assignments[sid]=ids.filter(n=>n!==id)}}}if(clean.ownerStudentId){const ass=db.assignments[clean.ownerStudentId]||[];if(!ass.includes(id))ass.push(id);db.assignments[clean.ownerStudentId]=ass;}audit('treino',`Ficha ${clean.name} salva (${clean.exercises.length} movimentos)`);ui.p5Builder=null;p5StoreDraft();ui.workoutId=id;save();render();notify('Ficha salva. Prescrição disponível no painel do aluno vinculado.');}
function p5Handle(node){const action=node.dataset.p5,id=node.dataset.id,index=Number(node.dataset.index||0);if(action==='tab'){ui.p5Tab=node.dataset.tab;ui.workoutId=null;render();return;}if(action==='new'){p5Begin('new',null,node.dataset.student||null);return;}if(action==='edit'){p5Begin('edit',Number(id));return;}if(action==='duplicate'){p5Begin('copy',Number(id));return;}if(action==='use'){p5Begin('new');ui.p5Builder.exercises.push(p5ExerciseFrom(p5Ref(id)));p5StoreDraft();render();return;}if(action==='add'){const ex=p5Ref(id);if(ex&&ui.p5Builder){ui.p5Builder.exercises.push(p5ExerciseFrom(ex));p5StoreDraft();render();notify('Exercício adicionado à sequência.')}return;}if(action==='custom'){ui.modal='p5-custom';render();return;}if(action==='cancel'){p5CloseBuilder();return;}if(action==='save'){p5SaveBuilder();return;}if(action==='remove'){ui.p5Builder?.exercises.splice(index,1);p5StoreDraft();render();return;}if(action==='move-up'||action==='move-down'){let array=ui.p5Builder?.exercises,j=action==='move-up'?index-1:index+1;if(!array||j<0||j>=array.length)return;[array[index],array[j]]=[array[j],array[index]];p5StoreDraft();render();return;}if(action==='print'){window.print();return;}}
// Intercepta apenas controles da nova área, antes dos eventos da versão anterior.
document.addEventListener('click',e=>{const n=e.target.closest('[data-p5]');if(n){e.preventDefault();e.stopPropagation();p5Handle(n);return;}const orig=e.target.closest('[data-action]');if(orig&&['p5-edit-fallback','p5-copy-fallback'].includes(orig.dataset.action)){e.preventDefault();e.stopPropagation();p5Begin(orig.dataset.action==='p5-edit-fallback'?'edit':'copy',Number(orig.dataset.id));}},true);
document.addEventListener('submit',e=>{const form=e.target.closest('form[data-form="p5-custom"]');if(!form)return;e.preventDefault();e.stopImmediatePropagation();let f=Object.fromEntries(new FormData(form)),name=String(f.name||'').trim(),eq=String(f.equipment||'').trim();if(!name||!eq){notify('Nome e equipamento são obrigatórios.');return;}if(p5All().some(x=>x.name.toLowerCase()===name.toLowerCase())){notify('Exercício já existe no catálogo.');return;}db.customExercises.push({id:'own-'+rndId(),name,group:f.group,equipment:eq,level:f.level,pattern:String(f.pattern||'').trim(),cue:String(f.cue||'').trim(),custom:true,origin:'Criado pelo personal'});save();ui.modal=null;render();notify('Exercício personalizado salvo no catálogo.');},true);
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.p5Plan&&ui.p5Builder){let v=el.value;ui.p5Builder[el.dataset.p5Plan]=el.dataset.p5Plan==='days'?v.split(',').map(x=>x.trim()).filter(Boolean):v;p5StoreDraft();return;}if(el.hasAttribute('data-p5-row')&&ui.p5Builder){let r=ui.p5Builder.exercises[Number(el.dataset.p5Row)];if(r)r[el.dataset.p5Field]=el.value;p5StoreDraft();return;}if(el.id==='p5-cat-search'||el.id==='p5-pick-search'){if(el.id==='p5-cat-search'){ui.p5Filter.search=el.value;let region=document.getElementById('p5-cat-results');if(region)region.innerHTML=p5LibraryResults(false);}else{ui.p5LibQuery=el.value;let region=document.getElementById('p5-pick-results');if(region)region.innerHTML=p5LibraryResults(true);}}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.p5Plan==='studentId'&&ui.p5Builder){ui.p5Builder.studentId=Number(el.value)||0;p5StoreDraft();return;}const catalog={'p5-cat-group':'group','p5-cat-equipment':'equipment','p5-cat-level':'level'};if(catalog[el.id]){ui.p5Filter[catalog[el.id]]=el.value;let box=document.getElementById('p5-cat-results');if(box)box.innerHTML=p5LibraryResults();}if(el.id==='p5-pick-group'){ui.p5LibGroup=el.value;let box=document.getElementById('p5-pick-results');if(box)box.innerHTML=p5LibraryResults(true);}});
// Conserva o comportamento de navegação e módulos v1–v4. Não restaurar rascunhos automaticamente em outra sessão.
render();
</script></body></html>
